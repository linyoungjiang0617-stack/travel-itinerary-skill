<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="32" fill="#fffaf3"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="55" y="65" font-size="32" font-weight="700" fill="#9d5b48">一张图，带走整趟路线</text><text x="55" y="100" font-size="17" fill="#9c8a7c">路线图虚构示意 · 时间可按实际行程调整</text><g fill="#fffefa" stroke="#eadbcb" stroke-width="2"><rect x="52" y="130" width="1095" height="105" rx="17"/><rect x="52" y="251" width="1095" height="105" rx="17"/><rect x="52" y="372" width="1095" height="105" rx="17"/></g><g font-size="19" fill="#564a41"><text x="76" y="168" fill="#c2715d">DAY 01</text><text x="220" y="168" font-weight="700">出发与入住</text><text x="76" y="208">出发城市 → 抵达目的地 → 酒店入住 → 附近晚餐</text><text x="76" y="289" fill="#c2715d">DAY 02</text><text x="220" y="289" font-weight="700">老街与海边</text><text x="76" y="329">早餐 → 老街慢游 → 就近午餐 → 海边公园 → 晚餐</text><text x="76" y="410" fill="#c2715d">DAY 03</text><text x="220" y="410" font-weight="700">返程</text><text x="76" y="450">退房 → 前往车站 → 预留办理时间 → 回家</text></g><text x="55" y="510" font-size="14" fill="#a39283">路线图为生成时的快照 · 具体地点、日期与费用均为虚构</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420">
<rect width="1200" height="1420" rx="28" fill="#f8f5ee"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
<text x="58" y="65" font-size="34" font-weight="700" fill="#8f5647">潮汕慢慢游 · 五天路线</text>
<text x="58" y="100" font-size="17" fill="#978575">根据最终版整理 · 实际住宿、航班、日期、订单和具体时间已隐藏</text>
<rect x="52" y="125" width="1096" height="227" rx="17" fill="#fffefa" stroke="#e8ddd0" stroke-width="2"/>
<text x="78" y="163" font-size="19" font-weight="700" fill="#c27761">DAY 01</text>
<text x="220" y="163" font-size="21" font-weight="700" fill="#57483f">抵达潮州 · 古城夜宵</text>
<text x="80" y="203" font-size="17" fill="#6a5d53">抵达揭阳潮汕机场 → 前往潮州古城住宿 → 放下行李</text>
<text x="80" y="237" font-size="17" fill="#6a5d53">夜宵首选：西门鳝鱼粿条</text>
<text x="80" y="271" font-size="17" fill="#6a5d53">备选：圆蛋酒料 / 官塘尚鱻鱼生·砂锅粥（较远）</text>
<text x="80" y="305" font-size="17" fill="#6a5d53">可选：开元路夜景短逛 → 返回住宿</text>
<rect x="52" y="368" width="1096" height="227" rx="17" fill="#fffefa" stroke="#e8ddd0" stroke-width="2"/>
<text x="78" y="406" font-size="19" font-weight="700" fill="#c27761">DAY 02</text>
<text x="220" y="406" font-size="21" font-weight="700" fill="#57483f">潮州古城 · 韩江夜景</text>
<text x="80" y="446" font-size="17" fill="#6a5d53">兴记粿汁 → 开元寺 → 古城短巷 → 胡荣泉小食</text>
<text x="80" y="480" font-size="17" fill="#6a5d53">广济楼 → 广济桥白天登桥 → 韩江西岸 / 广济门城楼</text>
<text x="80" y="514" font-size="17" fill="#6a5d53">东门街 → 阿彬牛肉广济桥店 → 江边短坐</text>
<text x="80" y="548" font-size="17" fill="#6a5d53">广济桥灯光秀 → 打车返回住宿</text>
<rect x="52" y="611" width="1096" height="261" rx="17" fill="#fffefa" stroke="#e8ddd0" stroke-width="2"/>
<text x="78" y="649" font-size="19" font-weight="700" fill="#c27761">DAY 03</text>
<text x="220" y="649" font-size="21" font-weight="700" fill="#57483f">潮州 → 汕头 · 朋友同行</text>
<text x="80" y="689" font-size="17" fill="#6a5d53">退房 → 谢记老牌肠粉（备选文香肠粉）→ 跨城去汕头</text>
<text x="80" y="723" font-size="17" fill="#6a5d53">入住汕头东区 → 隆江老尾猪脚饭 → 西堤公园</text>
<text x="80" y="757" font-size="17" fill="#6a5d53">短途车 → 小公园中山纪念亭 / 骑楼 → 老城自由活动</text>
<text x="80" y="791" font-size="17" fill="#6a5d53">朋友晚餐候选：飘香小食店 / 老二炒粿 / 福合埕牛肉丸</text>
<text x="80" y="825" font-size="17" fill="#6a5d53">老城活动结束 → 打车返回东区住宿</text>
<rect x="52" y="888" width="1096" height="227" rx="17" fill="#fffefa" stroke="#e8ddd0" stroke-width="2"/>
<text x="78" y="926" font-size="19" font-weight="700" fill="#c27761">DAY 04</text>
<text x="220" y="926" font-size="21" font-weight="700" fill="#57483f">南澳岛 · 海湾与海钓</text>
<text x="80" y="966" font-size="17" fill="#6a5d53">东区附近早餐 → 长山尾灯塔 → 前江湾短逛</text>
<text x="80" y="1000" font-size="17" fill="#6a5d53">后宅午餐：渔夫小炒店 / 阿伟海鲜坊 / 好再来饭店</text>
<text x="80" y="1034" font-size="17" fill="#6a5d53">前江湾沙滩 → 海钓集合登船 → 海钓（码头待确认）</text>
<text x="80" y="1068" font-size="17" fill="#6a5d53">返城东区 → 潮卤道卤水火锅 → 住宿与整理行李</text>
<rect x="52" y="1131" width="1096" height="159" rx="17" fill="#fffefa" stroke="#e8ddd0" stroke-width="2"/>
<text x="78" y="1169" font-size="19" font-weight="700" fill="#c27761">DAY 05</text>
<text x="220" y="1169" font-size="21" font-weight="700" fill="#57483f">汕头 → 机场 → 返程</text>
<text x="80" y="1209" font-size="17" fill="#6a5d53">提前准备早餐 → 起床洗漱 → 退房带齐行李</text>
<text x="80" y="1243" font-size="17" fill="#6a5d53">提前出发前往揭阳潮汕机场 → 办理手续 → 返程</text>
<text x="58" y="1334" font-size="16" fill="#9b7460">候选门店的老店历史、营业时间、口碑及路线需出行前核实；海钓码头待确认。</text>
<text x="58" y="1366" font-size="16" fill="#9b897a">行程图片按真实景点和候选名称重新排版；具体私人订单未公开。</text>
</g></svg>